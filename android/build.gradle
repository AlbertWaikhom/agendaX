// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

// Define root ext properties so subprojects that read rootProject.ext.* get correct values
ext {
  compileSdkVersion = 36
  targetSdkVersion  = 36
  minSdkVersion     = 24
  buildToolsVersion = "36.0.0"
  ndkVersion        = "27.1.12297006"
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

// Patch: force compileSdk on any third-party Android library that only uses the old
// compileSdkVersion API (which newer AGP no longer accepts as valid)
subprojects { subproject ->
  subproject.afterEvaluate {
    if (subproject.plugins.hasPlugin("com.android.library")) {
      subproject.android {
        compileSdk 36
      }
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
